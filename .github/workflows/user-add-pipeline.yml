name: Pipeline for User Add Microservice

on:
  push:
    branches:
      - test
    paths:
      - 'add-service/**'
      - '.github/workflows/user-add-pipeline.yml'
  pull_request:
    branches: 
      - test
    paths:
      - 'add-service/**'
      - '.github/workflows/user-add-pipeline.yml'

jobs:
  build-and-push-docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: docker buildx build -t ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_IMAGE_ADD_USER }}:latest ./add-service

      - name: Push Docker image to Dockerhub
        run: docker push ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_IMAGE_ADD_USER }}:latest

  deploy-to-ec2-instance:
    needs: build-and-push-docker
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST_TEST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          script: |
            echo "Pull, stop, and redeploy the Docker container"
            docker pull ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_IMAGE_ADD_USER }}:latest
            docker stop ${{ secrets.DOCKER_IMAGE_ADD_USER }} || true
            docker rm ${{ secrets.DOCKER_IMAGE_ADD_USER }} || true
            docker run --restart always \
                       -e DATABASE_URL=${{ secrets.DATABASE_URL }} \
                       -e JWT_SECRET=${{ secrets.JWT_SECRET }} \
                       -e JWT_EXPIRES_IN=${{ secrets.JWT_EXPIRES_IN }} \
                       -e BCRYPT_ROUNDS=${{ secrets.BCRYPT_ROUNDS }} \
                       -e PORT=${{ secrets.ADD_SERVICE_PORT }} \
                       -e HOST=${{ secrets.HOST }} \
                       -d --name ${{ secrets.DOCKER_IMAGE_ADD_USER }} \
                       -p ${{ secrets.ADD_SERVICE_PORT }}:${{ secrets.ADD_SERVICE_PORT }} \
                       ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_IMAGE_ADD_USER }}:latest
